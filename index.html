<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة التقاط الجواهر 💎</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #1e1b4b, #0f172a);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      overflow: hidden;
    }

    .game-wrapper {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 0.8rem 1.2rem;
      font-size: 1.1rem;
      font-weight: 900;
      backdrop-filter: blur(8px);
    }

    .score { color: #38bdf8; }
    .timer { color: #f59e0b; }

    #gameCanvas {
      background: #090d16;
      border: 2px solid rgba(56, 189, 248, 0.3);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(56, 189, 248, 0.1);
      width: 100%;
      display: block;
      touch-action: none;
    }

    .controls-hint {
      text-align: center;
      color: #94a3b8;
      font-size: 0.9rem;
    }

    /* شاشات البداية والنهاية */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      z-index: 10;
    }

    .overlay.hidden { display: none; }

    .overlay h1 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
      color: #38bdf8;
    }

    .overlay p {
      color: #cbd5e1;
      font-size: 1.05rem;
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }

    .btn-play {
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      border: none;
      color: #fff;
      font-size: 1.2rem;
      font-weight: 900;
      padding: 0.9rem 2.2rem;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
      transition: transform 0.2s;
    }

    .btn-play:hover { transform: scale(1.05); }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <div class="stats-bar">
      <div>💎 النقاط: <span id="scoreText" class="score">0</span></div>
      <div>⏱️ الوقت: <span id="timeText" class="timer">30</span>ث</div>
    </div>

    <div style="position: relative;">
      <canvas id="gameCanvas" width="400" height="520"></canvas>

      <!-- Start Overlay -->
      <div id="startScreen" class="overlay">
        <h1>صائد الجواهر 💎</h1>
        <p>التقط أكبر عدد من الجواهر المتساقطة قبل انتهاء الوقت!<br>وتفادَ القنابل الحمراء 💣</p>
        <button class="btn-play" onclick="startGame()">ابدأ اللعب 🚀</button>
      </div>

      <!-- Game Over Overlay -->
      <div id="endScreen" class="overlay hidden">
        <h1>انتهت الجولة! ⏱️</h1>
        <p>مجموع الجواهر التي جمعتها:<br><span id="finalScore" style="font-size: 3rem; color: #38bdf8; font-weight: 900;">0</span></p>
        <button class="btn-play" onclick="startGame()">العب ثانية 🔄</button>
      </div>
    </div>

    <div class="controls-hint">حرك السلة بالماوس، باللمس، أو بأسهم الكيبورد ⬅️ ➡️</div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Audio SFX
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // Player Basket
    const basket = {
      x: 160,
      y: 470,
      w: 80,
      h: 22,
      speed: 7
    };

    let items = [];
    let score = 0;
    let timeLeft = 30;
    let isRunning = false;
    let timerTimer = null;
    let leftPressed = false;
    let rightPressed = false;

    function startGame() {
      score = 0;
      timeLeft = 30;
      items = [];
      isRunning = true;
      document.getElementById("scoreText").innerText = score;
      document.getElementById("timeText").innerText = timeLeft;
      document.getElementById("startScreen").classList.add("hidden");
      document.getElementById("endScreen").classList.add("hidden");

      clearInterval(timerTimer);
      timerTimer = setInterval(() => {
        timeLeft--;
        document.getElementById("timeText").innerText = timeLeft;
        if (timeLeft <= 0) endGame();
      }, 1000);

      requestAnimationFrame(gameLoop);
    }

    function endGame() {
      isRunning = false;
      clearInterval(timerTimer);
      document.getElementById("finalScore").innerText = score;
      document.getElementById("endScreen").classList.remove("hidden");
    }

    function spawnItem() {
      if (Math.random() < 0.04) {
        const isBomb = Math.random() < 0.22;
        items.push({
          x: Math.random() * (canvas.width - 30) + 15,
          y: -20,
          size: 24,
          speed: 3 + Math.random() * 2.5,
          type: isBomb ? "bomb" : "gem"
        });
      }
    }

    function update() {
      // Keyboard move
      if (leftPressed && basket.x > 0) basket.x -= basket.speed;
      if (rightPressed && basket.x < canvas.width - basket.w) basket.x += basket.speed;

      spawnItem();

      for (let i = items.length - 1; i >= 0; i--) {
        let it = items[i];
        it.y += it.speed;

        // Collision with Basket
        if (
          it.y + it.size / 2 >= basket.y &&
          it.y - it.size / 2 <= basket.y + basket.h &&
          it.x >= basket.x &&
          it.x <= basket.x + basket.w
        ) {
          if (it.type === "gem") {
            score += 10;
            beep(700, 0.08);
          } else {
            score = Math.max(0, score - 15);
            beep(180, 0.15);
          }
          document.getElementById("scoreText").innerText = score;
          items.splice(i, 1);
          continue;
        }

        // Off screen
        if (it.y > canvas.height + 20) {
          items.splice(i, 1);
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Basket
      ctx.fillStyle = "#38bdf8";
      ctx.beginPath();
      ctx.roundRect(basket.x, basket.y, basket.w, basket.h, 10);
      ctx.fill();

      // Basket Glow
      ctx.fillStyle = "rgba(56, 189, 248, 0.3)";
      ctx.beginPath();
      ctx.roundRect(basket.x - 4, basket.y - 2, basket.w + 8, basket.h + 4, 12);
      ctx.fill();

      // Draw Items
      ctx.font = "24px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      items.forEach(it => {
        ctx.fillText(it.type === "gem" ? "💎" : "💣", it.x, it.y);
      });
    }

    function gameLoop() {
      if (!isRunning) return;
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // Controls
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a") leftPressed = true;
      if (e.key === "ArrowRight" || e.key === "d") rightPressed = true;
    });

    window.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a") leftPressed = false;
      if (e.key === "ArrowRight" || e.key === "d") rightPressed = false;
    });

    // Touch & Mouse
    function setBasketPos(clientX) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const mouseX = (clientX - rect.left) * scaleX;
      basket.x = Math.max(0, Math.min(canvas.width - basket.w, mouseX - basket.w / 2));
    }

    canvas.addEventListener("mousemove", (e) => setBasketPos(e.clientX));
    canvas.addEventListener("touchmove", (e) => {
      if (e.touches.length > 0) {
        setBasketPos(e.touches[0].clientX);
      }
    }, { passive: true });
  </script>
</body>
</html>
